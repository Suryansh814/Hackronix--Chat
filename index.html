<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover"/>
  <title>HACKRONIX Chat</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-panel: #12121a;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0b0;
      --accent-green: #00ff88;
      --accent-green-dim: #00aa55;
      --border: #2a2a3a;
      --message-out: #00cc66;
      --message-in: #1e1e2e;
      --notification-dot: #ff4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    /* === SCREEN 1: LOGIN === */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: radial-gradient(circle at 30% 30%, #0f141f, #0a0a0f);
      position: absolute;
      width: 100%;
      z-index: 10;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--accent-green);
      text-shadow: 0 0 10px var(--accent-green-dim);
      margin-bottom: 1rem;
    }

    .logo span {
      color: white;
    }

    .tagline {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .login-box {
      background: var(--bg-panel);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
      border: 1px solid var(--border);
      width: 90%;
      max-width: 400px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 1rem;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: var(--accent-green);
      color: var(--bg-dark);
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-box button:hover {
      background: var(--accent-green-dim);
    }

    .login-box .note {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 10px;
      text-align: center;
    }

    /* === SCREEN 2: ACTIVE USERS === */
    #users-screen {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .header-title {
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--accent-green);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      position: relative;
    }

    .user-badge .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--bg-dark);
      overflow: hidden;
      position: relative;
    }

    .user-badge .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-badge .status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 5px var(--accent-green);
    }

    .notification-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--notification-dot);
      color: white;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      padding: 1rem;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar li {
      padding: 0.8rem;
      margin: 0.5rem 0;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .sidebar li:hover {
      background: rgba(0, 255, 136, 0.1);
    }

    .sidebar li.active {
      background: rgba(0, 255, 136, 0.2);
      border-left: 3px solid var(--accent-green);
    }

    .users-list {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
    }

    .users-list h2 {
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }

    .user-item {
      display: flex;
      align-items: center;
      padding: 1rem;
      background: var(--bg-panel);
      border-radius: 8px;
      margin-bottom: 0.8rem;
      cursor: pointer;
      transition: 0.3s;
      border: 1px solid var(--border);
      position: relative;
    }

    .user-item:hover {
      border-color: var(--accent-green);
      transform: translateY(-2px);
    }

    .user-item .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--bg-dark);
      margin-right: 1rem;
      overflow: hidden;
      position: relative;
    }

    .user-item .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info {
      flex: 1;
    }

    .user-info .name {
      font-weight: bold;
      font-size: 1rem;
    }

    .user-info .handle {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .user-item .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent-green);
      font-size: 0.9rem;
    }

    .user-item .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 5px var(--accent-green);
    }

    .user-item .offline-status {
      color: var(--text-secondary);
    }

    .user-item .offline-status .status-dot {
      background: var(--text-secondary);
      box-shadow: none;
    }

    .user-item .notification-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--notification-dot);
      color: white;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
    }

    /* === SCREEN 3: PROFILE === */
    #profile-screen {
      display: none;
      height: 100vh;
      flex-direction: column;
      background: var(--bg-dark);
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }

    .profile-content {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-avatar-container {
      position: relative;
      margin-bottom: 2rem;
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--bg-dark);
      font-size: 3rem;
      overflow: hidden;
      position: relative;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-upload {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--accent-green);
      color: var(--bg-dark);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
    }

    .profile-form {
      width: 100%;
      max-width: 400px;
    }

    .profile-form input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 1rem;
    }

    .profile-form button {
      width: 100%;
      padding: 12px;
      background: var(--accent-green);
      color: var(--bg-dark);
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 1rem;
    }

    .profile-form button:hover {
      background: var(--accent-green-dim);
    }

    .profile-form .logout-btn {
      background: #ff4444;
      color: white;
    }

    .profile-form .logout-btn:hover {
      background: #cc0000;
    }

    /* === SCREEN 4: CHAT === */
    #chat-screen {
      display: none;
      height: 100vh;
      flex-direction: column;
      background: var(--bg-dark);
      height: 100dvh;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--accent-green);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .chat-header .user-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .chat-header .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--bg-dark);
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }

    .chat-header .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-messages {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding-bottom: 1rem;
    }

    .message {
      max-width: 70%;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      position: relative;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .message.sent {
      align-self: flex-end;
      background: var(--message-out);
      color: var(--bg-dark);
    }

    .message.received {
      align-self: flex-start;
      background: var(--message-in);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .message .time {
      font-size: 0.7rem;
      opacity: 0.8;
      text-align: right;
      margin-top: 0.3rem;
    }

    .message img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 0.5rem;
      cursor: pointer;
      transition: filter 0.3s;
    }

    .message img.blur {
      filter: blur(10px);
    }

    .message img.blur:hover {
      filter: blur(0);
    }

    .message .file-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      margin-top: 0.5rem;
    }

    .message .download-btn {
      background: var(--accent-green);
      color: var(--bg-dark);
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .chat-input-container {
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
      gap: 0.5rem;
      position: sticky;
      bottom: 0;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    }

    .chat-input {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .chat-input input {
      flex: 1;
      padding: 0.8rem;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 1rem;
      height: 44px;
    }

    .chat-input button {
      background: var(--accent-green);
      border: none;
      border-radius: 6px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .chat-input .tools {
      display: flex;
      gap: 0.5rem;
    }

    .chat-input .tool-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }

    .chat-input .tool-btn:hover {
      border-color: var(--accent-green);
    }

    /* File upload styles */
    .file-upload {
      display: none;
    }

    .file-info-preview {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Save chat button */
    .save-chat-btn {
      background: var(--accent-green);
      color: var(--bg-dark);
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .save-chat-btn:hover {
      background: var(--accent-green-dim);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .main-content {
        flex-direction: column;
      }

      .users-list {
        padding: 1rem;
      }

      .chat-header .user-info {
        font-size: 0.9rem;
      }

      .chat-input-container {
        padding: 0.8rem 1rem;
      }

      .chat-input input {
        font-size: 16px; /* Prevents zoom on iOS */
      }
    }
  </style>
</head>
<body>

  <!-- === SCREEN 1: LOGIN === -->
  <div id="login-screen">
    <div class="logo">HACK<span>RONIX</span> Chat</div>
    <div class="tagline">Connect. Chat. Collaborate.</div>
    <div class="login-box">
      <input type="text" id="username" placeholder="Enter your username" />
      <button onclick="connect()">CONNECT →</button>
      <div class="note">✅ No signup needed. Just enter a username.</div>
    </div>
  </div>

  <!-- === SCREEN 2: ACTIVE USERS === -->
  <div id="users-screen">
    <div class="header">
      <div class="header-left">
        <div class="header-title">Active Users</div>
        <div class="user-badge" onclick="openProfile()">
          <div class="avatar" id="current-user-avatar">U</div>
          <div class="status"></div>
          <div class="notification-badge" id="header-notification" style="display: none;">0</div>
        </div>
      </div>
    </div>
    <div class="main-content">
      <div class="sidebar">
        <ul>
          <li class="active">👥 Active Users</li>
          <li>💬 Chats</li>
          <li>⚙️ Settings</li>
        </ul>
      </div>
      <div class="users-list">
        <h2>Active Users <span style="font-size: 0.9rem; color: var(--accent-green);">(● <span id="active-count">0</span> Online)</span></h2>
        <div id="users-container">
          <!-- Users will be injected here via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- === SCREEN 3: PROFILE === -->
  <div id="profile-screen">
    <div class="profile-header">
      <div class="header-left">
        <div class="header-title">Profile Settings</div>
      </div>
      <button class="back-btn" onclick="backToUsers()">←</button>
    </div>
    <div class="profile-content">
      <div class="profile-avatar-container">
        <div class="profile-avatar" id="profile-avatar">U</div>
        <div class="avatar-upload" onclick="document.getElementById('avatar-upload').click()">📷</div>
        <input type="file" id="avatar-upload" class="file-upload" onchange="handleAvatarUpload(event)" accept="image/*" />
      </div>
      <div class="profile-form">
        <input type="text" id="profile-username" placeholder="Username" />
        <button onclick="saveProfile()">Save Profile</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>

  <!-- === SCREEN 4: CHAT === -->
  <div id="chat-screen">
    <div class="chat-header">
      <div class="chat-header-left">
        <button class="back-btn" onclick="backToUsers()">←</button>
        <div class="user-info">
          <div class="avatar" id="chat-user-avatar">U</div>
          <div>
            <div class="name" id="chat-username">User</div>
            <div class="status" id="chat-user-status" style="color: var(--accent-green); font-size: 0.8rem;">● Online</div>
          </div>
        </div>
      </div>
      <button class="save-chat-btn" onclick="saveChat()">💾 Save Chat</button>
    </div>
    <div class="chat-messages" id="chat-messages">
      <!-- Messages will be injected here -->
    </div>
    <div class="chat-input-container">
      <div class="chat-input">
        <div class="tools">
          <button class="tool-btn" onclick="document.getElementById('file-upload').click()">📎</button>
          <input type="file" id="file-upload" class="file-upload" onchange="handleFileUpload(event)" />
        </div>
        <input type="text" id="message-input" placeholder="Type your message..." />
        <button onclick="sendMessage()">➤</button>
      </div>
      <div class="file-info-preview" id="file-info"></div>
    </div>
  </div>

  <script>
    // Firebase configuration - replace with your own config
    const firebaseConfig = {
      apiKey: "AIzaSyDLOJaqXam4gvKmEeWVUjHe23hLJcgYNeQ",
      authDomain: "hackronix-chat.firebaseapp.com",
      databaseURL: "https://hackronix-chat-default-rtdb.firebaseio.com",
      projectId: "hackronix-chat",
      storageBucket: "hackronix-chat.firebasestorage.app",
      messagingSenderId: "93791534329",
      appId: "1:93791534329:web:a0188903985d4298ff3628",
      measurementId: "G-86ZQTD0F2L"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Variables
    let currentUser = "";
    let currentChatUser = null;
    let chats = {}; // Store all chat messages
    let userProfile = {}; // Store user profile data
    let messageSent = {}; // Track sent messages to prevent duplicates
    let activeMessageId = null; // Track active message ID
    let notifications = {}; // Track unread messages
    let userStatus = {}; // Track user online/offline status

    // Check if user is already logged in (localStorage)
    window.onload = function() {
      const savedUser = localStorage.getItem('hackronix-user');
      if (savedUser) {
        const userData = JSON.parse(savedUser);
        currentUser = userData.username;
        userProfile = userData.profile || {};
        
        // Skip login screen and go directly to users screen
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("users-screen").style.display = "flex";
        
        // Update UI with saved user data
        updateAvatar('current-user-avatar', currentUser);
        
        // Initialize Firebase listeners
        initializeFirebaseListeners();
      }
    };

    // Update avatar in any element
    function updateAvatar(elementId, username) {
      const element = document.getElementById(elementId);
      if (userProfile.avatar) {
        element.innerHTML = `<img src="\${userProfile.avatar}" alt="Avatar" />`;
      } else {
        element.textContent = username.charAt(0).toUpperCase();
      }
    }

    // Update user avatar by username
    function updateUserAvatar(elementId, username, profileData) {
      const element = document.getElementById(elementId);
      if (profileData && profileData.avatar) {
        element.innerHTML = `<img src="${profileData.avatar}" alt="Avatar" />`;
      } else {
        element.textContent = username.charAt(0).toUpperCase();
      }
    }

    // Initialize Firebase listeners
    function initializeFirebaseListeners() {
      // Add user to active users
      const userRef = database.ref('activeUsers/' + currentUser);
      userRef.set({
        name: currentUser,
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        profile: userProfile
      });

      // Listen for active users
      database.ref('activeUsers').on('value', (snapshot) => {
        const users = snapshot.val();
        renderUsers(users);
        
        // Update online/offline status
        if (users && currentChatUser) {
          updateChatUserStatus(users[currentChatUser] ? true : false);
        }
      });

      // Listen for messages
      database.ref('messages').on('value', (snapshot) => {
        const messages = snapshot.val();
        if (messages) {
          // Update chats object
          Object.keys(messages).forEach(key => {
            const message = messages[key];
            const chatId = getChatId(message.sender, message.receiver);
            
            if (!chats[chatId]) {
              chats[chatId] = [];
            }
            
            // Add message if not already in chat
            const messageExists = chats[chatId].some(msg => 
              msg.id === message.id
            );
            
            if (!messageExists) {
              chats[chatId].push(message);
              
              // Track notifications for received messages
              if (message.receiver === currentUser && currentChatUser !== message.sender) {
                if (!notifications[message.sender]) {
                  notifications[message.sender] = 0;
                }
                notifications[message.sender]++;
                updateNotificationBadge();
              }
            }
          });
          
          // If in chat view, update messages
          if (currentChatUser) {
            displayMessages(currentChatUser);
          }
        }
      });

      // Remove user on disconnect
      userRef.onDisconnect().remove();
    }

    // Update notification badge
    function updateNotificationBadge() {
      const badge = document.getElementById('header-notification');
      const totalNotifications = Object.values(notifications).reduce((sum, count) => sum + count, 0);
      
      if (totalNotifications > 0) {
        badge.textContent = totalNotifications;
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    }

    // Update chat user status
    function updateChatUserStatus(isOnline) {
      const statusElement = document.getElementById('chat-user-status');
      if (isOnline) {
        statusElement.textContent = '● Online';
        statusElement.style.color = 'var(--accent-green)';
      } else {
        statusElement.textContent = '● Offline';
        statusElement.style.color = 'var(--text-secondary)';
      }
    }

    // Connect function
    function connect() {
      const input = document.getElementById("username").value.trim();
      if (!input) {
        alert("Please enter a username!");
        return;
      }
      currentUser = input;
      
      // Save user data to localStorage
      localStorage.setItem('hackronix-user', JSON.stringify({
        username: currentUser,
        profile: userProfile
      }));
      
      updateAvatar('current-user-avatar', currentUser);
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("users-screen").style.display = "flex";
      
      // Initialize Firebase listeners
      initializeFirebaseListeners();
    }

    // Get chat ID for two users
    function getChatId(user1, user2) {
      return [user1, user2].sort().join('-');
    }

    // Generate unique message ID
    function generateMessageId() {
      return `${currentUser}-${Date.now()}-${Math.random().toString(36).substring(7)}`;
    }

    // Render active users
    function renderUsers(users) {
      const container = document.getElementById("users-container");
      container.innerHTML = "";

      if (!users) {
        document.getElementById("active-count").textContent = "0";
        return;
      }

      const userNames = Object.keys(users).filter(name => name !== currentUser);
      document.getElementById("active-count").textContent = userNames.length;

      userNames.forEach(username => {
        const div = document.createElement("div");
        div.className = "user-item";
        
        // Get user profile data
        const userProfileData = users[username].profile || {};
        
        // Get user avatar if available
        let avatarHtml = username.charAt(0).toUpperCase();
        if (userProfileData.avatar) {
          avatarHtml = `<img src="\${userProfileData.avatar}" alt="Avatar" />`;
        }
        
        // Check for unread messages
        const unreadCount = notifications[username] || 0;
        const notificationBadge = unreadCount > 0 ? 
          `<div class="notification-badge">\${unreadCount}</div>` : '';
        
        div.innerHTML = `
          <div class="avatar">\${avatarHtml}</div>
          <div class="user-info">
            <div class="name">\${username}</div>
            <div class="handle">@\${username.toLowerCase()}</div>
          </div>
          <div class="status"><div class="status-dot"></div> Online</div>
          \${notificationBadge}
        `;
        div.onclick = () => startChat(username);
        container.appendChild(div);
      });
    }

    // Start chat
    function startChat(username) {
      currentChatUser = username;
      document.getElementById("users-screen").style.display = "none";
      document.getElementById("chat-screen").style.display = "flex";
      document.getElementById("chat-username").textContent = username;
      
      // Clear notifications for this user
      if (notifications[username]) {
        delete notifications[username];
        updateNotificationBadge();
      }
      
      // Update chat header avatar with user profile
      database.ref('activeUsers/' + username).once('value').then((snapshot) => {
        const userData = snapshot.val();
        if (userData && userData.profile) {
          updateUserAvatar('chat-user-avatar', username, userData.profile);
        } else {
          document.getElementById("chat-user-avatar").textContent = username.charAt(0).toUpperCase();
        }
      });
      
      // Check if user is online
      database.ref('activeUsers/' + username).once('value').then((snapshot) => {
        updateChatUserStatus(snapshot.exists());
      });
      
      // Display messages for this chat
      displayMessages(username);
    }

    // Display messages for a specific chat
    function displayMessages(username) {
      const container = document.getElementById("chat-messages");
      container.innerHTML = "";

      const chatId = getChatId(currentUser, username);
      if (chats[chatId]) {
        chats[chatId].forEach(message => {
          addMessageToUI(message.text, message.sender === currentUser ? "sent" : "received", message.timestamp, message);
        });
      }

      // Scroll to bottom
      container.scrollTop = container.scrollHeight;
    }

    // Send message
    function sendMessage() {
      const input = document.getElementById("message-input");
      const msg = input.value.trim();
      if (!msg || !currentChatUser) return;

      // Create unique message ID
      const messageId = generateMessageId();
      
      const messageData = {
        id: messageId,
        sender: currentUser,
        receiver: currentChatUser,
        text: msg,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      // Add message to database
      const pushRef = database.ref('messages').push();
      pushRef.set(messageData);
      
      // Track sent message to prevent duplicates
      messageSent[messageId] = true;

      // Clear input
      input.value = "";
    }

    // Add message to UI with proper formatting
    function addMessageToUI(text, type, timestamp, messageData) {
      const container = document.getElementById("chat-messages");
      const msg = document.createElement("div");
      msg.className = `message \${type}`;
      
      // Format timestamp
      let timeStr = "";
      if (timestamp) {
        const date = new Date(timestamp);
        timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      
      // Check if it's a file message
      if (messageData.isFile) {
        msg.innerHTML = `
          <div class="file-info">
            <span>[FILE] ${messageData.fileName} (${formatFileSize(messageData.fileSize)})</span>
            <button class="download-btn" onclick="downloadFile('${messageData.fileData}', '${messageData.fileName}')">⬇️ Download</button>
          </div>
          <div class="time">\${timeStr}</div>
        `;
      } else if (text.startsWith('[FILE]')) {
        // Parse file info
        const fileMatch = text.match(/$$FILE$$ (.+?) $$(.+?)$$/);
        if (fileMatch) {
          msg.innerHTML = `
            <div class="file-info">
              <span>[FILE] ${fileMatch[1]} (${fileMatch[2]})</span>
            </div>
            <div class="time">\${timeStr}</div>
          `;
        } else {
          msg.innerHTML = `
            \${text}
            <div class="time">\${timeStr}</div>
          `;
        }
      } else if (isValidImageURL(text)) {
        // Check if it's an image
        msg.innerHTML = `
          <img src="\${text}" alt="Image" class="blur" onclick="toggleImageBlur(this)" />
          <div class="time">\${timeStr}</div>
        `;
      } else {
        // Regular text message
        msg.innerHTML = `
          \${text}
          <div class="time">\${timeStr}</div>
        `;
      }
      
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    // Toggle image blur
    function toggleImageBlur(imgElement) {
      imgElement.classList.toggle('blur');
    }

    // Check if text is a valid image URL
    function isValidImageURL(text) {
      return text.match(/\.(jpeg|jpg|gif|png|webp)$/i) != null;
    }

    // Handle file upload
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file || !currentChatUser) return;

      // Show file info
      const fileInfo = document.getElementById('file-info');
      fileInfo.textContent = `Selected: ${file.name} (${formatFileSize(file.size)})`;

      // Read file and send as message
      const reader = new FileReader();
      reader.onload = function(e) {
        const fileData = e.target.result;
        
        // Determine if it's an image
        const isImage = file.type.startsWith('image/');
        
        // Send message
        let messageText;
        if (isImage) {
          messageText = fileData; // Send image as data URL
        } else {
          messageText = `[FILE] ${file.name} (${formatFileSize(file.size)})`;
        }

        const messageData = {
          sender: currentUser,
          receiver: currentChatUser,
          text: messageText,
          timestamp: firebase.database.ServerValue.TIMESTAMP,
          isFile: !isImage,
          fileName: file.name,
          fileSize: file.size,
          fileType: file.type,
          fileData: fileData
        };

        // Add message to database
        database.ref('messages').push(messageData);

        // Clear file input
        event.target.value = '';
        fileInfo.textContent = '';
      };

      reader.readAsDataURL(file);
    }

    // Format file size
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // Download file
    function downloadFile(fileData, fileName) {
      const link = document.createElement('a');
      link.href = fileData;
      link.download = fileName || 'downloaded_file';
      link.click();
    }

    // Open profile screen
    function openProfile() {
      document.getElementById("users-screen").style.display = "none";
      document.getElementById("profile-screen").style.display = "flex";
      
      // Load current profile data
      document.getElementById("profile-username").value = currentUser;
      updateAvatar('profile-avatar', currentUser);
    }

    // Handle avatar upload
    function handleAvatarUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      // Read file and save to profile
      const reader = new FileReader();
      reader.onload = function(e) {
        const avatarData = e.target.result;
        userProfile.avatar = avatarData;
        
        // Update UI
        document.getElementById("profile-avatar").innerHTML = `<img src="\${avatarData}" alt="Avatar" />`;
        
        // Update user badge
        updateAvatar('current-user-avatar', currentUser);
        
        // Update profile in Firebase
        database.ref('activeUsers/' + currentUser).update({
          profile: userProfile
        });
        
        // Update localStorage
        localStorage.setItem('hackronix-user', JSON.stringify({
          username: currentUser,
          profile: userProfile
        }));
      };

      reader.readAsDataURL(file);
    }

    // Save profile
    function saveProfile() {
      const newUsername = document.getElementById("profile-username").value.trim();
      if (!newUsername) {
        alert("Username cannot be empty!");
        return;
      }
      
      // Update username if changed
      if (newUsername !== currentUser) {
        // Remove old username from active users
        database.ref('activeUsers/' + currentUser).remove();
        
        // Update current username
        currentUser = newUsername;
        
        // Update localStorage
        localStorage.setItem('hackronix-user', JSON.stringify({
          username: currentUser,
          profile: userProfile
        }));
        
        // Update user in active users with new profile
        const userRef = database.ref('activeUsers/' + currentUser);
        userRef.set({
          name: currentUser,
          timestamp: firebase.database.ServerValue.TIMESTAMP,
          profile: userProfile
        });
      }
      
      // Update UI
      updateAvatar('current-user-avatar', currentUser);
      
      // Go back to users screen
      backToUsers();
    }

    // Logout function
    function logout() {
      // Remove user from active users
      database.ref('activeUsers/' + currentUser).remove();
      
      // Clear localStorage
      localStorage.removeItem('hackronix-user');
      
      // Reset variables
      currentUser = "";
      userProfile = {};
      chats = {};
      messageSent = {};
      notifications = {};
      userStatus = {};
      
      // Go back to login screen
      document.getElementById("profile-screen").style.display = "none";
      document.getElementById("users-screen").style.display = "none";
      document.getElementById("chat-screen").style.display = "none";
      document.getElementById("login-screen").style.display = "flex";
    }

    // Back to users
    function backToUsers() {
      document.getElementById("profile-screen").style.display = "none";
      document.getElementById("chat-screen").style.display = "none";
      document.getElementById("users-screen").style.display = "flex";
      currentChatUser = null;
    }

    // Save chat
    function saveChat() {
      if (!currentChatUser) return;

      const chatId = getChatId(currentUser, currentChatUser);
      if (!chats[chatId] || chats[chatId].length === 0) {
        alert("No messages to save!");
        return;
      }

      // Create text content
      let content = `Chat between ${currentUser} and ${currentChatUser}\n`;
      content += `Date: ${new Date().toLocaleString()}\n\n`;

      chats[chatId].forEach(message => {
        const sender = message.sender === currentUser ? "You" : message.sender;
        const date = new Date(message.timestamp);
        const time = date.toLocaleString();
        
        // Handle file messages
        if (message.isFile) {
          content += `[${time}] ${sender}: [FILE] ${message.fileName} (${formatFileSize(message.fileSize)})\n`;
        } else if (message.text.startsWith('[FILE]')) {
          content += `[${time}] ${sender}: ${message.text}\n`;
        } else {
          content += `[${time}] ${sender}: ${message.text}\n`;
        }
      });

      // Create blob and download
      const blob = new Blob([content], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `chat_${currentUser}_${currentChatUser}_${Date.now()}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Enter to send
    document.getElementById("message-input").addEventListener("keypress", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    // Cleanup on page unload
    window.addEventListener("beforeunload", () => {
      if (currentUser) {
        database.ref('activeUsers/' + currentUser).remove();
      }
    });

    // Mobile viewport fix
    function fixMobileViewport() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      
      if (isMobile) {
        // Set proper viewport height
        const setViewportHeight = () => {
          const vh = window.innerHeight * 0.01;
          document.documentElement.style.setProperty('--vh', `\${vh}px`);
        };
        
       setViewportHeight();
        window.addEventListener('resize', setViewportHeight);
        
        // Focus handling for input
        const messageInput = document.getElementById('message-input');
        messageInput.addEventListener('focus', () => {
          setTimeout(() => {
            document.querySelector('.chat-messages').scrollTo(0, document.querySelector('.chat-messages').scrollHeight);
          }, 300);
        });
      }
    }

    // Initialize mobile viewport fix
    window.addEventListener('load', fixMobileViewport);
  </script>
</body>
</html>
