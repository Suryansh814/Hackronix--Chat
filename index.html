<!DOCTYPE html>
<html lang="en">
<head>
   
  <!-- other stuff -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HACKRONIX Chat</title>
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-panel: #12121a;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0b0;
      --accent-green: #00ff88;
      --accent-green-dim: #00aa55;
      --border: #2a2a3a;
      --message-out: #00cc66;
      --message-in: #1e1e2e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    /* === SCREEN 1: LOGIN === */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: radial-gradient(circle at 30% 30%, #0f141f, #0a0a0f);
      position: absolute;
      width: 100%;
      z-index: 10;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--accent-green);
      text-shadow: 0 0 10px var(--accent-green-dim);
      margin-bottom: 1rem;
    }

    .logo span {
      color: white;
    }

    .tagline {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .login-box {
      background: var(--bg-panel);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
      border: 1px solid var(--border);
      width: 90%;
      max-width: 400px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 1rem;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: var(--accent-green);
      color: var(--bg-dark);
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-box button:hover {
      background: var(--accent-green-dim);
    }

    .login-box .note {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 10px;
      text-align: center;
    }

    /* === SCREEN 2: ACTIVE USERS === */
    #users-screen {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .header-title {
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--accent-green);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .user-badge .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--bg-dark);
    }

    .user-badge .status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 5px var(--accent-green);
    }

    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      padding: 1rem;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar li {
      padding: 0.8rem;
      margin: 0.5rem 0;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .sidebar li:hover {
      background: rgba(0, 255, 136, 0.1);
    }

    .sidebar li.active {
      background: rgba(0, 255, 136, 0.2);
      border-left: 3px solid var(--accent-green);
    }

    .users-list {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
    }

    .users-list h2 {
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }

    .user-item {
      display: flex;
      align-items: center;
      padding: 1rem;
      background: var(--bg-panel);
      border-radius: 8px;
      margin-bottom: 0.8rem;
      cursor: pointer;
      transition: 0.3s;
      border: 1px solid var(--border);
    }

    .user-item:hover {
      border-color: var(--accent-green);
      transform: translateY(-2px);
    }

    .user-item .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--bg-dark);
      margin-right: 1rem;
    }

    .user-info {
      flex: 1;
    }

    .user-info .name {
      font-weight: bold;
      font-size: 1rem;
    }

    .user-info .handle {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .user-item .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent-green);
      font-size: 0.9rem;
    }

    .user-item .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 5px var(--accent-green);
    }

    /* === SCREEN 3: CHAT === */
    #chat-screen {
      display: none;
      height: 100vh;
      flex-direction: column;
      background: var(--bg-dark);
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--accent-green);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .chat-header .user-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .chat-messages {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 70%;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      position: relative;
    }

    .message.sent {
      align-self: flex-end;
      background: var(--message-out);
      color: var(--bg-dark);
    }

    .message.received {
      align-self: flex-start;
      background: var(--message-in);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .message .time {
      font-size: 0.7rem;
      opacity: 0.8;
      text-align: right;
      margin-top: 0.3rem;
    }

    .chat-input {
      display: flex;
      padding: 1rem 1.5rem;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      gap: 1rem;
      align-items: center;
    }

    .chat-input input {
      flex: 1;
      padding: 0.8rem;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 1rem;
    }

    .chat-input button {
      background: var(--accent-green);
      border: none;
      border-radius: 6px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .chat-input .tools {
      display: flex;
      gap: 0.5rem;
    }

    .chat-input .tool-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }

    .chat-input .tool-btn:hover {
      border-color: var(--accent-green);
    }

    /* Save chat button */
    .save-chat-btn {
      background: var(--accent-green);
      color: var(--bg-dark);
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .save-chat-btn:hover {
      background: var(--accent-green-dim);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .main-content {
        flex-direction: column;
      }

      .users-list {
        padding: 1rem;
      }

      .chat-header .user-info {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- === SCREEN 1: LOGIN === -->
  <div id="login-screen">
    <div class="logo">HACK<span>RONIX</span> Chat</div>
    <div class="tagline">Connect. Chat. Collaborate.</div>
    <div class="login-box">
      <input type="text" id="username" placeholder="Enter your username" />
      <button onclick="connect()">CONNECT →</button>
      <div class="note">✅ No signup needed. Just enter a username.</div>
    </div>
  </div>

  <!-- === SCREEN 2: ACTIVE USERS === -->
  <div id="users-screen">
    <div class="header">
      <div class="header-left">
        <div class="header-title">Active Users</div>
        <div class="user-badge">
          <div class="avatar" id="current-user-avatar">U</div>
          <div class="status"></div>
        </div>
      </div>
    </div>
    <div class="main-content">
      <div class="sidebar">
        <ul>
          <li class="active">👥 Active Users</li>
          <li>💬 Chats</li>
          <li>🌍 Explore</li>
          <li>👥 Groups</li>
        </ul>
      </div>
      <div class="users-list">
        <h2>Active Users <span style="font-size: 0.9rem; color: var(--accent-green);">(● <span id="active-count">0</span> Online)</span></h2>
        <div id="users-container">
          <!-- Users will be injected here via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- === SCREEN 3: CHAT === -->
  <div id="chat-screen">
    <div class="chat-header">
      <div class="chat-header-left">
        <button class="back-btn" onclick="backToUsers()">←</button>
        <div class="user-info">
          <div class="avatar" id="chat-user-avatar">U</div>
          <div>
            <div class="name" id="chat-username">User</div>
            <div class="status" style="color: var(--accent-green); font-size: 0.8rem;">● Online</div>
          </div>
        </div>
      </div>
      <button class="save-chat-btn" onclick="saveChat()">💾 Save Chat</button>
    </div>
    <div class="chat-messages" id="chat-messages">
      <!-- Messages will be injected here -->
    </div>
    <div class="chat-input">
      <div class="tools">
        <button class="tool-btn">📎</button>
        <button class="tool-btn">😊</button>
      </div>
      <input type="text" id="message-input" placeholder="Type your message..." />
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    // Firebase configuration - replace with your own config
    // Firebase configuration - replace with your own config
const firebaseConfig = {
  apiKey: "AIzaSyDLOJaqXam4gvKmEeWVUjHe23hLJcgYNeQ",
  authDomain: "hackronix-chat.firebaseapp.com",
  databaseURL: "https://hackronix-chat-default-rtdb.firebaseio.com",
  projectId: "hackronix-chat",
  storageBucket: "hackronix-chat.firebasestorage.app",
  messagingSenderId: "93791534329",
  appId: "1:93791534329:web:a0188903985d4298ff3628",
  measurementId: "G-86ZQTD0F2L"
};
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Variables
    let currentUser = "";
    let currentChatUser = null;
    let chats = {}; // Store all chat messages

    // Connect function
    function connect() {
      const input = document.getElementById("username").value.trim();
      if (!input) {
        alert("Please enter a username!");
        return;
      }
      currentUser = input;
      document.getElementById("current-user-avatar").textContent = currentUser.charAt(0).toUpperCase();
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("users-screen").style.display = "flex";

      // Add user to active users
      const userRef = database.ref('activeUsers/' + currentUser);
      userRef.set({
        name: currentUser,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });

      // Listen for active users
      database.ref('activeUsers').on('value', (snapshot) => {
        renderUsers(snapshot.val());
      });

      // Listen for messages
      database.ref('messages').on('value', (snapshot) => {
        const messages = snapshot.val();
        if (messages) {
          // Update chats object
          Object.keys(messages).forEach(key => {
            const message = messages[key];
            const chatId = getChatId(message.sender, message.receiver);
            
            if (!chats[chatId]) {
              chats[chatId] = [];
            }
            
            // Add message if not already in chat
            const messageExists = chats[chatId].some(msg => 
              msg.sender === message.sender && 
              msg.receiver === message.receiver && 
              msg.text === message.text && 
              msg.timestamp === message.timestamp
            );
            
            if (!messageExists) {
              chats[chatId].push(message);
            }
          });
          
          // If in chat view, update messages
          if (currentChatUser) {
            displayMessages(currentChatUser);
          }
        }
      });

      // Remove user on disconnect
      userRef.onDisconnect().remove();
    }

    // Get chat ID for two users
    function getChatId(user1, user2) {
      return [user1, user2].sort().join('-');
    }

    // Render active users
    function renderUsers(users) {
      const container = document.getElementById("users-container");
      container.innerHTML = "";

      if (!users) {
        document.getElementById("active-count").textContent = "0";
        return;
      }

      const userNames = Object.keys(users).filter(name => name !== currentUser);
      document.getElementById("active-count").textContent = userNames.length;

      userNames.forEach(username => {
        const div = document.createElement("div");
        div.className = "user-item";
        div.innerHTML = `
          <div class="avatar">${username.charAt(0).toUpperCase()}</div>
          <div class="user-info">
            <div class="name">${username}</div>
            <div class="handle">@${username.toLowerCase()}</div>
          </div>
          <div class="status"><div class="status-dot"></div> Online</div>
        `;
        div.onclick = () => startChat(username);
        container.appendChild(div);
      });
    }

    // Start chat
    function startChat(username) {
      currentChatUser = username;
      document.getElementById("users-screen").style.display = "none";
      document.getElementById("chat-screen").style.display = "flex";
      document.getElementById("chat-username").textContent = username;
      document.getElementById("chat-user-avatar").textContent = username.charAt(0).toUpperCase();
      
      // Display messages for this chat
      displayMessages(username);
    }

    // Display messages for a specific chat
    function displayMessages(username) {
      const container = document.getElementById("chat-messages");
      container.innerHTML = "";

      const chatId = getChatId(currentUser, username);
      if (chats[chatId]) {
        chats[chatId].forEach(message => {
          addMessageToUI(message.text, message.sender === currentUser ? "sent" : "received", message.timestamp);
        });
      }

      // Scroll to bottom
      container.scrollTop = container.scrollHeight;
    }

    // Send message
    function sendMessage() {
      const input = document.getElementById("message-input");
      const msg = input.value.trim();
      if (!msg || !currentChatUser) return;

      const messageData = {
        sender: currentUser,
        receiver: currentChatUser,
        text: msg,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      // Add message to database
      database.ref('messages').push(messageData);

      // Clear input
      input.value = "";
    }

    // Add message to UI
    function addMessageToUI(text, type, timestamp) {
      const container = document.getElementById("chat-messages");
      const msg = document.createElement("div");
      msg.className = `message ${type}`;
      
      // Format timestamp
      let timeStr = "";
      if (timestamp) {
        const date = new Date(timestamp);
        timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      
      msg.innerHTML = `
        ${text}
        <div class="time">${timeStr}</div>
      `;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    // Back to users
    function backToUsers() {
      document.getElementById("chat-screen").style.display = "none";
      document.getElementById("users-screen").style.display = "flex";
      currentChatUser = null;
    }

    // Save chat
    function saveChat() {
      if (!currentChatUser) return;

      const chatId = getChatId(currentUser, currentChatUser);
      if (!chats[chatId] || chats[chatId].length === 0) {
        alert("No messages to save!");
        return;
      }

      // Create text content
      let content = `Chat between ${currentUser} and ${currentChatUser}\n`;
      content += `Date: ${new Date().toLocaleString()}\n\n`;

      chats[chatId].forEach(message => {
        const sender = message.sender === currentUser ? "You" : message.sender;
        const date = new Date(message.timestamp);
        const time = date.toLocaleString();
        content += `[${time}] ${sender}: ${message.text}\n`;
      });

      // Create blob and download
      const blob = new Blob([content], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `chat_${currentUser}_${currentChatUser}_${Date.now()}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Enter to send
    document.getElementById("message-input").addEventListener("keypress", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    // Cleanup on page unload
    window.addEventListener("beforeunload", () => {
      if (currentUser) {
        database.ref('activeUsers/' + currentUser).remove();
      }
    });
  </script>
</body>
</html>
